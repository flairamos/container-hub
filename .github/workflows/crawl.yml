name: Daily AI Sites Crawl

on:
  schedule:
    # 每天 UTC 03:23（北京时间 11:23），避开整点拥堵。
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crawl, classify and refresh data
        run: node scripts/main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_LIMIT: '25'

      - name: Validate generated data
        run: node scripts/validate.mjs

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/icons
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore: refresh AI sites $(date -u +%F)"
            git push
          fi
