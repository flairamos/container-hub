<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="55%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#051B18" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="60" y1="60" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="140" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="100" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="78" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect width="400" height="400" rx="72" fill="url(#bgGrad)" />

  <!-- Subtle FinOps Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.65">
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="50" y1="160" x2="350" y2="160" />
    <line x1="50" y1="220" x2="350" y2="220" />
    <line x1="50" y1="280" x2="350" y2="280" />
    <line x1="110" y1="60" x2="110" y2="310" />
    <line x1="200" y1="60" x2="200" y2="310" />
    <line x1="290" y1="60" x2="290" y2="310" />
  </g>

  <!-- Inner Border Ring -->
  <rect x="18" y="18" width="364" height="364" rx="58" stroke="url(#emeraldGlow)" stroke-width="3" stroke-opacity="0.55" />

  <!-- Top Pill Badge -->
  <rect x="96" y="42" width="208" height="30" rx="15" fill="#0F172A" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="116" cy="57" r="5" fill="#10B981" />
  <text x="130" y="62" fill="#A7F3D0" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2">FINOPS ENGINE</text>

  <!-- Ascending Margin Columns -->
  <rect x="82" y="196" width="54" height="94" rx="10" fill="url(#barGrad1)" stroke="#10B981" stroke-width="2" />
  <rect x="173" y="148" width="54" height="142" rx="10" fill="url(#barGrad2)" stroke="#06B6D4" stroke-width="2" />
  <rect x="264" y="96" width="54" height="194" rx="10" fill="url(#barGrad3)" stroke="#34D399" stroke-width="2.5" />

  <!-- Margin Curve Line + Nodes -->
  <path d="M109 182 L200 134 L291 80" stroke="#34D399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  <circle cx="109" cy="182" r="7" fill="#060B14" stroke="#10B981" stroke-width="4" />
  <circle cx="200" cy="134" r="7" fill="#060B14" stroke="#06B6D4" stroke-width="4" />
  <circle cx="291" cy="80" r="8" fill="#10B981" stroke="#ECFDF5" stroke-width="3" />

  <!-- Stylized "TM" Monogram Overlay Badge -->
  <rect x="64" y="218" width="128" height="72" rx="14" fill="#09101E" fill-opacity="0.92" stroke="#334155" stroke-width="2" />
  <text x="128" y="268" text-anchor="middle" fill="#F8FAFC" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5">TM</text>

  <!-- +82% Margin Tag -->
  <rect x="218" y="232" width="114" height="44" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <text x="275" y="260" text-anchor="middle" fill="#34D399" font-family="JetBrains Mono, Consolas, monospace" font-size="21" font-weight="800">+82.4%</text>

  <!-- Bottom Wordmark -->
  <text x="200" y="346" text-anchor="middle" fill="#F8FAFC" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.6">
    Token<tspan fill="#34D399">Margin</tspan><tspan fill="#38BDF8" font-size="22">.dev</tspan>
  </text>
</svg>
