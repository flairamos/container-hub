<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="45%" stop-color="#d9d9d9"/>
      <stop offset="55%" stop-color="#c2c2c2"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <g transform="translate(260,260)">
    <!-- back layer: 6 petals rotated 30 degrees, sitting behind the front layer -->
    <g opacity="0.85">
      <g id="petalsBack" >
        <path d="M 0,-8 C -55,-70 -55,-190 0,-250 C 55,-190 55,-70 0,-8 Z" fill="url(#petalGrad)" stroke="#bcbcbc" stroke-width="1"/>
        <line x1="0" y1="-8" x2="0" y2="-250" stroke="#bfbfbf" stroke-width="1.5"/>
      </g>
      <use href="#petalsBack" transform="rotate(60)"/>
      <use href="#petalsBack" transform="rotate(120)"/>
      <use href="#petalsBack" transform="rotate(180)"/>
      <use href="#petalsBack" transform="rotate(240)"/>
      <use href="#petalsBack" transform="rotate(300)"/>
      <!-- <use href="#petalsBack" transform="rotate(330)"/> -->
    </g>

    <!-- 6 petals, rotated 60 degrees apart, scaled down -->
    <g transform="scale(0.78)">
      <g id="petals" transform="rotate(30)">
        <path d="M 0,-8 C -55,-70 -55,-190 0,-250 C 55,-190 55,-70 0,-8 Z" fill="url(#petalGrad)" stroke="#bcbcbc" stroke-width="1"/>
        <line x1="0" y1="-8" x2="0" y2="-250" stroke="#bfbfbf" stroke-width="1.5" opacity="0.6"/>
      </g>
      <use href="#petals" transform="rotate(60)"/>
      <use href="#petals" transform="rotate(120)"/>
      <use href="#petals" transform="rotate(180)"/>
      <use href="#petals" transform="rotate(240)"/>
      <use href="#petals" transform="rotate(300)"/>
    </g>

    <!-- center: cream ring + gold circle -->
    <circle cx="0" cy="0" r="72" fill="#faf6df"/>
    <circle cx="0" cy="0" r="60" fill="#dba627"/>
  </g>
</svg>